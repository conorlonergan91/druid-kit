[tool.ruff]
line-length = 120
target-version = "py310"
src = ["tools", "tests", "planner"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests embed long Lua mock snippets and build the runtime in steps.
"tests/*" = ["E501", "E402", "E701", "E702", "UP031"]
# Route data: long guide sentences read better unwrapped.
"tools/example_route.py" = ["E501"]
